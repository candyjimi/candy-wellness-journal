<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Candy今天运动了</title>
  <style>
    :root{--bg:#f2f1ed;--card:#fff;--ink:#070814;--muted:#7d7e86;--line:#ececf0;--accent:#e85f36;--blue:#35b7f4;--blue2:#7ce0ef;--yellow:#fff0c9;--yellow2:#ffb72c;--soft:#f7e7df;--shadow:0 10px 28px rgba(32,29,25,.055)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
    body{display:flex;justify-content:center}
    button,input,textarea{font:inherit}button{border:0;cursor:pointer}
    .app{width:100%;max-width:520px;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
    .hero{padding:8px 4px 20px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:750;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:"";width:22px;height:2px;border-radius:4px;background:var(--accent)}
    h1{margin:9px 0 10px;font-size:34px;line-height:1.1;letter-spacing:-.04em}.bio{margin:0;color:#65615b;font-size:13px;line-height:1.72}.bio b{color:var(--ink);font-weight:700}
    .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(20,20,20,.025)}
    .step-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;flex:none}.step-title{font-size:17px;font-weight:800;letter-spacing:-.02em}.step-sub{margin-left:auto;font-size:11px;color:#a09c95}
    .sports{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.sport{min-width:0;height:79px;border-radius:18px;background:#f1f0ed;color:#79766f;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:2px solid transparent;transition:.18s ease;padding:4px}.sport .icon{font-size:25px;filter:grayscale(1);line-height:1}.sport .label{font-size:13px;font-weight:700;white-space:nowrap}.sport.active{background:#fff5f0;color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}.sport.active .icon{filter:none}
    .field-row{display:grid;grid-template-columns:35% 1fr;gap:9px}label.mini{display:block;font-size:11px;font-weight:700;color:#8b8780;margin:0 0 7px 3px}input,textarea{width:100%;border:1.5px solid var(--line);background:#faf9f7;border-radius:15px;color:var(--ink);outline:none;transition:.2s ease}input{height:49px;padding:0 13px;font-size:14px}textarea{height:80px;padding:13px;resize:none;line-height:1.5;font-size:14px}input:focus,textarea:focus{border-color:var(--accent);background:#fff}
    .times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.time{height:47px;border-radius:15px;background:#f1f0ed;color:#716d66;font-weight:750;font-size:13px;border:2px solid transparent;white-space:nowrap;padding:0}.time.active{background:var(--ink);color:#fff;border-color:var(--ink)}.optional{color:#aaa59e;font-size:11px;font-weight:500}.counter{text-align:right;color:#aaa59e;font-size:10px;margin:5px 3px 0}
    .upload-box{margin-top:12px;border:1.5px dashed #d8d6d0;border-radius:18px;background:#fbfaf8;min-height:92px;display:flex;align-items:center;gap:12px;padding:12px;position:relative;overflow:hidden}.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-icon{width:54px;height:54px;border-radius:18px;background:linear-gradient(160deg,#e85f36,#f19a72);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}.upload-text strong{display:block;font-size:14px;margin-bottom:4px}.upload-text span{font-size:12px;color:#88847d;line-height:1.45}.photo-preview{display:none;width:76px;height:76px;border-radius:16px;object-fit:cover;flex:none}.upload-box.has-photo .photo-preview{display:block}.upload-box.has-photo .upload-icon{display:none}.remove-photo{display:none;position:relative;z-index:2;margin-left:auto;width:34px;height:34px;border-radius:12px;background:#fff;color:#555;box-shadow:0 4px 14px rgba(0,0,0,.08)}.upload-box.has-photo .remove-photo{display:grid;place-items:center}
    .error{display:none;margin:2px 2px 12px;padding:11px 13px;border-radius:13px;background:#fff0ec;color:#b33f25;font-size:13px;font-weight:650;line-height:1.45}.error.show{display:block;animation:shake .25s ease}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
    .primary{width:100%;height:58px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 22px rgba(232,95,54,.25);transition:.18s ease}.primary:active{transform:scale(.985)}
    .records-head{display:flex;justify-content:space-between;align-items:center;padding:15px 4px 11px}.records-head h2{font-size:21px;margin:0;letter-spacing:-.03em}.clear-all{background:transparent;color:#a55c48;font-size:12px;font-weight:700;padding:8px}.clear-all:disabled{opacity:.35}.empty{text-align:center;padding:27px 16px 31px;color:#99948c}.empty .empty-icon{font-size:33px;margin-bottom:8px;filter:grayscale(1)}.empty strong{display:block;color:#6e6a64;font-size:14px;margin-bottom:4px}.empty span{font-size:12px}
    .record{padding:0;margin-bottom:16px;border-radius:30px;background:#fff;box-shadow:0 14px 38px rgba(14,18,28,.08);overflow:hidden;border:1px solid #ededf0}.record-shell{padding:22px 18px 18px}.record-top{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center}.medal{width:74px;height:74px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:35px}.record-kpi{min-width:0}.record-kpi .big{font-size:42px;font-weight:900;letter-spacing:-.08em;line-height:.95}.record-kpi .big span{font-size:21px;letter-spacing:-.02em;margin-left:3px}.record-kpi .sub{margin-top:8px;color:#a3a4aa;font-size:13px;font-weight:800}.record-date{text-align:right;color:#9b9ca2;font-size:11px;font-weight:700;line-height:1.45;white-space:nowrap}.visual{margin:20px 0 16px;height:176px;border-radius:26px;overflow:hidden;background:#f1f2f4;position:relative}.visual img{width:100%;height:100%;object-fit:cover;display:block}.visual.placeholder{background:linear-gradient(180deg,#f7f8fa,#eceff2)}.route-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(53,183,244,.12)}.route-dot:nth-child(1){left:14%;top:66%}.route-dot:nth-child(2){left:26%;top:49%;background:#71d8ee}.route-dot:nth-child(3){left:41%;top:58%}.route-dot:nth-child(4){left:57%;top:35%;background:#71d8ee}.route-dot:nth-child(5){left:73%;top:45%}.route-dot:nth-child(6){left:84%;top:28%;background:#159fe9}.location-pill{position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-detail{display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:stretch}.blue-card{border-radius:24px;background:linear-gradient(165deg,var(--blue),var(--blue2));padding:16px 13px;color:#fff;min-width:0}.blue-card .time-big{font-size:25px;font-weight:900;line-height:1;letter-spacing:-.05em}.blue-card .mini-label{font-size:11px;opacity:.86;margin-top:8px}.blue-card .icon-circle{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:22px;margin:15px 0 13px}.blue-card .sport-name{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-copy{border:1px solid #eeeeef;border-radius:24px;padding:16px 14px;min-width:0}.detail-copy .tag{font-size:12px;color:#a3a4aa;font-weight:800;margin-bottom:8px}.detail-copy .place{font-size:17px;font-weight:900;line-height:1.22;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail-copy .feeling{font-size:13px;color:#686a72;line-height:1.48;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.record-actions{display:grid;grid-template-columns:1fr 42px;gap:10px;margin-top:14px}.share-open,.del{height:44px;border-radius:15px;font-weight:850}.share-open{background:#f5f7f9;color:#111827}.del{background:#fff1ed;color:#b44b2d}.share-modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(7,8,20,.68);backdrop-filter:blur(8px)}.share-modal.open{display:flex}.modal-card{width:min(92vw,420px);max-height:92vh;background:#fff;border-radius:28px;padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.28);position:relative;overflow-y:auto}.modal-close{position:absolute;z-index:2;right:22px;top:22px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:#171716;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.12)}.modal-image{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:20px;background:#f7f8fa;user-select:none;-webkit-user-select:none;-webkit-touch-callout:default}.share-tip{text-align:center;font-size:11px;color:#8d8982;margin:11px 0}.share-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-buttons button,.share-buttons a{height:44px;border-radius:14px;background:#f2f4f7;color:var(--ink);font-size:13px;font-weight:800;text-decoration:none;display:grid;place-items:center}
    .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:rgba(20,20,19,.92);color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:650;opacity:0;pointer-events:none;transition:.25s ease;z-index:10;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:360px){.app{padding-left:12px;padding-right:12px}.card{padding:16px}.sport{height:72px}.sport .icon{font-size:22px}.sport .label{font-size:12px}.time{font-size:12px}.bio{font-size:12px}h1{font-size:30px}.record-kpi .big{font-size:36px}.medal{width:64px;height:64px}.visual{height:154px}.blue-card .time-big{font-size:22px}}
  </style>
</head>
<body>
<main class="app">
  <header class="hero"><div class="eyebrow">Candy’s Wellness Journal</div><h1>Candy 的运动日记</h1><p class="bio"><b>从迈开第一步开始，世界就变大了。</b><br>2019—2020 跑步｜2021—2023 普拉提与游泳<br>2024—2025 骑行与徒步｜2026 学习网球中<br>坐标深圳及周边，持续解锁新的运动快乐。</p></header>
  <section class="card"><div class="step-head"><span class="num">1</span><span class="step-title">今天做了什么？</span><span class="step-sub">单选</span></div><div class="sports" id="sports"><button class="sport" data-sport="骑行" data-icon="🚴"><span class="icon">🚴</span><span class="label">骑行</span></button><button class="sport" data-sport="网球" data-icon="🎾"><span class="icon">🎾</span><span class="label">网球</span></button><button class="sport" data-sport="徒步" data-icon="🥾"><span class="icon">🥾</span><span class="label">徒步</span></button><button class="sport" data-sport="游泳" data-icon="🏊"><span class="icon">🏊</span><span class="label">游泳</span></button></div></section>
  <section class="card"><div class="step-head"><span class="num">2</span><span class="step-title">在哪里运动？</span></div><div class="field-row"><div><label class="mini" for="city">城市</label><input id="city" maxlength="10" placeholder="如 深圳"></div><div><label class="mini" for="place">地点 / 路线</label><input id="place" maxlength="30" placeholder="如 西丽湖环湖路线"></div></div></section>
  <section class="card"><div class="step-head"><span class="num">3</span><span class="step-title">运动了多久？</span><span class="step-sub">分钟</span></div><div class="times" id="times"><button class="time" data-time="30">30</button><button class="time" data-time="60">60</button><button class="time" data-time="90">90</button><button class="time" data-time="120">120</button></div></section>
  <section class="card"><div class="step-head"><span class="num">4</span><span class="step-title">今天感觉怎么样？ <span class="optional">选填</span></span></div><textarea id="feeling" maxlength="60" placeholder="留一句话给今天的自己……"></textarea><div class="counter"><span id="count">0</span>/60</div><label class="upload-box" id="uploadBox"><input id="photoInput" type="file" accept="image/*"><img class="photo-preview" id="photoPreview" alt="已上传的运动照片"><span class="upload-icon">＋</span><span class="upload-text"><strong>上传今天的运动照片</strong><span>为今天的热爱，留下一帧纪念</span></span><button class="remove-photo" id="removePhoto" type="button" aria-label="移除照片">×</button></label></section>
  <div class="error" id="error" role="alert"></div><button class="primary" id="generate">生成今日打卡记录</button>
  <div class="records-head"><h2>今日记录</h2><button id="clearAll" class="clear-all" disabled>清空记录</button></div><section id="records"><div class="card empty"><div class="empty-icon">⏳</div><strong>正在读取记录…</strong><span>稍等一下，正在找回你的运动足迹</span></div></section>
</main><div class="share-modal" id="shareModal" role="dialog" aria-modal="true" aria-label="分享图片预览"><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="关闭预览">×</button><img class="modal-image" id="modalImage" alt="运动打卡分享图"><div class="share-tip">在手机上长按图片即可保存，也可以使用下方按钮</div><div class="share-buttons"><button id="modalShare">分享图片</button><a id="modalDownload" download="Candy运动打卡.png">保存图片</a></div></div></div><div class="toast" id="toast"></div>
<script>
(() => {
  const state={sport:'',icon:'',time:'',records:[],photoData:'',loading:true};
  const locationPresets={'骑行':{city:'如 深圳',place:'如 西丽湖环湖路线'},'网球':{city:'如 深圳',place:'如 安托山网球场'},'徒步':{city:'如 香港',place:'如 麦理浩径'},'游泳':{city:'如 深圳',place:'如 深圳湾文体中心'}};
  const DB_NAME='candy-wellness-journal', DB_VERSION=1, STORE_NAME='records';
  let activeShareRecord=null, dbPromise=null;
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const city=$('#city'), place=$('#place'), feeling=$('#feeling'), error=$('#error'), recordsEl=$('#records'), clearAll=$('#clearAll'), uploadBox=$('#uploadBox'), photoInput=$('#photoInput'), photoPreview=$('#photoPreview');
  const escapeHTML=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  $$('.sport').forEach(btn=>btn.addEventListener('click',()=>{const changed=state.sport&&state.sport!==btn.dataset.sport;state.sport=btn.dataset.sport;state.icon=btn.dataset.icon;$$('.sport').forEach(x=>x.classList.toggle('active',x===btn));if(changed){city.value='';place.value='';showToast('已更换运动，旧地点已清空')}const preset=locationPresets[state.sport];city.placeholder=preset.city;place.placeholder=preset.place;hideError()}));
  $$('.time').forEach(btn=>btn.addEventListener('click',()=>{state.time=btn.dataset.time;$$('.time').forEach(x=>x.classList.toggle('active',x===btn));hideError()}));
  feeling.addEventListener('input',()=>$('#count').textContent=feeling.value.length);
  photoInput.addEventListener('change',async()=>{const file=photoInput.files&&photoInput.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('请上传图片文件');photoInput.value='';return}photoInput.disabled=true;showToast('正在压缩照片…');try{const compressed=await compressPhoto(file);state.photoData=compressed;photoPreview.src=compressed;uploadBox.classList.add('has-photo');showToast('照片已压缩并添加')}catch(e){console.error('照片压缩失败：',e);photoInput.value='';showToast('照片处理失败，请换一张照片重试')}finally{photoInput.disabled=false}});
  $('#removePhoto').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();state.photoData='';photoInput.value='';photoPreview.removeAttribute('src');uploadBox.classList.remove('has-photo');showToast('照片已移除')});
  function hideError(){error.classList.remove('show')}function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
  function showInlineError(text){error.textContent=text;error.classList.add('show');error.scrollIntoView({behavior:'smooth',block:'center'})}
  function friendlyStorageError(e,action='保存'){if(e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'))return `浏览器存储空间不足，${action}没有完成。请清理一些浏览器空间后重试。`;if(e&&(e.name==='SecurityError'||e.name==='InvalidStateError'||e.message==='INDEXEDDB_UNAVAILABLE'))return `当前浏览器无法使用本地存储，${action}没有完成。请退出无痕模式或换一个浏览器重试。`;return `${action}没有完成，请稍后重试。你的页面没有被错误修改。`}
  function openDatabase(){if(!('indexedDB' in window))return Promise.reject(new Error('INDEXEDDB_UNAVAILABLE'));if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{let request;try{request=indexedDB.open(DB_NAME,DB_VERSION)}catch(e){reject(e);return}request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME,{keyPath:'id'})};request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>{db.close();dbPromise=null};db.onclose=()=>{dbPromise=null};resolve(db)};request.onerror=()=>reject(request.error||new Error('数据库打开失败'));request.onblocked=()=>console.warn('IndexedDB 升级被其他页面阻塞，请关闭旧页面后重试')});return dbPromise}
  function useStore(mode,action){return openDatabase().then(db=>new Promise((resolve,reject)=>{let tx,request;try{tx=db.transaction(STORE_NAME,mode);request=action(tx.objectStore(STORE_NAME))}catch(e){console.error('IndexedDB 事务创建失败：',e);reject(e);return}tx.oncomplete=()=>resolve(request&&request.result);tx.onerror=()=>reject(tx.error||(request&&request.error)||new Error('数据库操作失败'));tx.onabort=()=>reject(tx.error||(request&&request.error)||new Error('数据库操作已中止'))}))}
  function recordForStorage(r){return {id:r.id,sport:r.sport,icon:r.icon,time:r.time,city:r.city,place:r.place,feeling:r.feeling,photoData:typeof r.photoData==='string'?r.photoData:'',date:r.date,shortDate:r.shortDate}}
  function saveStoredRecord(r){return useStore('readwrite',store=>store.put(recordForStorage(r)))}
  function deleteStoredRecord(id){return useStore('readwrite',store=>store.delete(id))}
  function clearStoredRecords(){return useStore('readwrite',store=>store.clear())}
  function getStoredRecords(){return useStore('readonly',store=>store.getAll())}
  function isValidRecord(r){return r&&Number.isFinite(r.id)&&typeof r.sport==='string'&&typeof r.icon==='string'&&typeof r.time==='string'&&typeof r.city==='string'&&typeof r.place==='string'&&typeof r.feeling==='string'&&typeof r.date==='string'&&typeof r.shortDate==='string'&&(typeof r.photoData==='string'||typeof r.photoData==='undefined')}
  async function loadSavedRecords(){try{const rows=await getStoredRecords();state.records=rows.filter(r=>{const valid=isValidRecord(r);if(!valid)console.warn('已跳过一条格式异常的运动记录：',r);return valid}).map(recordForStorage).sort((a,b)=>b.id-a.id)}catch(e){console.error('读取运动记录失败：',e);showToast(friendlyStorageError(e,'读取记录'))}finally{state.loading=false;render();$('#generate').disabled=false}}
  function blobToDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('照片读取失败'));reader.readAsDataURL(blob)})}
  function loadPhotoSource(file){if('createImageBitmap' in window)return createImageBitmap(file,{imageOrientation:'from-image'}).then(bitmap=>({source:bitmap,width:bitmap.width,height:bitmap.height,cleanup:()=>bitmap.close()})).catch(()=>loadPhotoWithImage(file));return loadPhotoWithImage(file)}
  function loadPhotoWithImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>resolve({source:img,width:img.naturalWidth,height:img.naturalHeight,cleanup:()=>URL.revokeObjectURL(url)});img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片解码失败'))};img.src=url})}
  function canvasToBlob(canvas,type,quality){return new Promise((resolve,reject)=>{try{canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('照片压缩失败')),type,quality)}catch(e){reject(e)}})}
  async function compressPhoto(file){const loaded=await loadPhotoSource(file);try{if(!loaded.width||!loaded.height)throw new Error('无法读取照片尺寸');const maxSide=1600,scale=Math.min(1,maxSide/Math.max(loaded.width,loaded.height)),width=Math.max(1,Math.round(loaded.width*scale)),height=Math.max(1,Math.round(loaded.height*scale)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('浏览器不支持照片压缩');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(loaded.source,0,0,width,height);let blob;try{blob=await canvasToBlob(canvas,'image/webp',.82)}catch(e){console.warn('WebP 压缩不可用，改用 JPEG：',e)}if(!blob||blob.type!=='image/webp')blob=await canvasToBlob(canvas,'image/jpeg',.84);if(blob.size>2500000)blob=await canvasToBlob(canvas,blob.type==='image/webp'?'image/webp':'image/jpeg',.68);return await blobToDataURL(blob)}finally{loaded.cleanup()}}
  function validate(){const missing=[];if(!state.sport)missing.push('运动项目');if(!city.value.trim())missing.push('城市');if(!place.value.trim())missing.push('地点或路线');if(!state.time)missing.push('运动时间');if(missing.length){error.textContent='还差：'+missing.join('、')+'。填写完整后再生成记录哦。';error.classList.add('show');error.scrollIntoView({behavior:'smooth',block:'center'});return false}hideError();return true}
  function niceDate(d){return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'}).format(d).replace(/\//g,'.')}
  function renderVisual(r){if(r.photoData)return `<div class="visual"><img src="${r.photoData}" alt="运动照片"><span class="location-pill">${escapeHTML(r.city)} · ${escapeHTML(r.place)}</span></div>`;return `<div class="visual placeholder"><span class="route-dot"></span><span class="route-dot"></span><span class="route-dot"></span><span class="route-dot"></span><span class="route-dot"></span><span class="route-dot"></span><span class="location-pill">${escapeHTML(r.city)} · ${escapeHTML(r.place)}</span></div>`}
  async function openShareModal(r){activeShareRecord=r;const modal=$('#shareModal'),image=$('#modalImage'),download=$('#modalDownload');modal.classList.add('open');document.body.style.overflow='hidden';image.removeAttribute('src');image.alt='正在生成分享图';if(!r.dataUrl)r.dataUrl=await makeCanvas(r);if(activeShareRecord!==r)return;image.src=r.dataUrl;image.alt=r.sport+'运动打卡分享图';download.href=r.dataUrl;download.download=`Candy运动打卡-${r.id}.png`}
  function closeShareModal(){activeShareRecord=null;$('#shareModal').classList.remove('open');document.body.style.overflow=''}
  function render(){if(state.loading){clearAll.disabled=true;recordsEl.innerHTML='<div class="card empty"><div class="empty-icon">⏳</div><strong>正在读取记录…</strong><span>稍等一下，正在找回你的运动足迹</span></div>';return}clearAll.disabled=!state.records.length;if(!state.records.length){recordsEl.innerHTML='<div class="card empty"><div class="empty-icon">🏁</div><strong>还没有运动记录</strong><span>完成上面的步骤，留下今天的高光时刻</span></div>';return}recordsEl.innerHTML=state.records.map(r=>`<article class="record" data-id="${r.id}"><div class="record-shell"><div class="record-top"><div class="medal">🏅</div><div class="record-kpi"><div class="big">${r.time}<span>min</span></div><div class="sub">${escapeHTML(r.sport)} · 今日完成</div></div><div class="record-date">${r.shortDate}<br>Candy</div></div>${renderVisual(r)}<div class="record-detail"><div class="blue-card"><div class="time-big">${r.time}:00</div><div class="mini-label">Total Time</div><div class="icon-circle">${r.icon}</div><div class="sport-name">${escapeHTML(r.sport)}</div></div><div class="detail-copy"><div class="tag">Today's Note</div><div class="place">${escapeHTML(r.city)} · ${escapeHTML(r.place)}</div><div class="feeling">${escapeHTML(r.feeling||'今天也认真地照顾了自己。')}</div></div></div><div class="record-actions"><button class="share-open">生成分享图</button><button class="del" aria-label="删除记录">×</button></div></div></article>`).join('');$$('.record').forEach(el=>{const r=state.records.find(v=>String(v.id)===el.dataset.id);el.querySelector('.share-open').onclick=()=>openShareModal(r);el.querySelector('.del').onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;try{await deleteStoredRecord(r.id);state.records=state.records.filter(v=>v.id!==r.id);if(activeShareRecord&&activeShareRecord.id===r.id)closeShareModal();render();showToast('已删除这条记录')}catch(err){console.error('删除运动记录失败：',err);btn.disabled=false;showToast(friendlyStorageError(err,'删除记录'))}}})}
  function loadImg(src){return new Promise(resolve=>{if(!src)return resolve(null);const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src})}
  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}function fillRound(ctx,x,y,w,h,r,color){ctx.fillStyle=color;roundRect(ctx,x,y,w,h,r);ctx.fill()}function drawCover(ctx,img,x,y,w,h){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.save();roundRect(ctx,x,y,w,h,48);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore()}function dottedRoute(ctx,x,y,w,h){const pts=[[.14,.66],[.26,.49],[.41,.58],[.57,.35],[.73,.45],[.84,.28]];pts.forEach((p,i)=>{ctx.fillStyle=i%2?'#78ddee':'#35b7f4';ctx.beginPath();ctx.arc(x+w*p[0],y+h*p[1],15,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(53,183,244,.15)';ctx.beginPath();ctx.arc(x+w*p[0],y+h*p[1],31,0,Math.PI*2);ctx.fill()})}
  async function makeCanvas(r){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#070814';x.font='800 54px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('Candy今天运动了',78,118);x.fillStyle='#a3a4aa';x.font='700 30px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText(r.shortDate+' · '+r.city,78,166);fillRound(x,78,220,168,168,84,'#fff0c9');x.textAlign='center';x.font='78px sans-serif';x.fillText('🏅',162,330);x.textAlign='left';x.fillStyle='#070814';x.font='900 128px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText(r.time,292,318);x.font='800 52px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('min',520,318);x.fillStyle='#a3a4aa';x.font='800 34px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText(r.sport+' · 今日完成',298,380);const img=await loadImg(r.photoData);if(img)drawCover(x,img,78,460,924,520);else{fillRound(x,78,460,924,520,54,'#f1f3f5');dottedRoute(x,78,460,924,520)}fillRound(x,118,880,844,74,37,'rgba(255,255,255,.9)');x.fillStyle='#070814';x.font='800 31px -apple-system, BlinkMacSystemFont, sans-serif';fitText(x,r.city+' · '+r.place,540,928,760,true);fillRound(x,78,1050,924,500,54,'#ffffff');x.strokeStyle='#ececf0';x.lineWidth=3;roundRect(x,78,1050,924,500,54);x.stroke();const g=x.createLinearGradient(118,1096,118,1492);g.addColorStop(0,'#35b7f4');g.addColorStop(1,'#7ce0ef');fillRound(x,118,1096,390,396,48,g);x.fillStyle='#fff';x.font='900 64px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText(r.time+':00',152,1198);x.font='700 30px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('Total Time',152,1252);fillRound(x,152,1306,96,96,48,'#ffffff');x.textAlign='center';x.fillStyle='#35b7f4';x.font='52px sans-serif';x.fillText(r.icon,200,1370);x.textAlign='left';x.fillStyle='#fff';x.font='850 40px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText(r.sport,152,1452);x.fillStyle='#a3a4aa';x.font='800 29px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('Today\'s Note',560,1146);x.fillStyle='#070814';x.font='900 48px -apple-system, BlinkMacSystemFont, sans-serif';wrapLeft(x,r.place,560,1218,370,58,2);x.fillStyle='#666a73';x.font='32px -apple-system, BlinkMacSystemFont, sans-serif';wrapLeft(x,r.feeling||'今天也认真地照顾了自己。',560,1378,370,44,3);x.fillStyle='#070814';x.font='800 38px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('保持运动，保持热爱',78,1690);x.fillStyle='#9da0a8';x.font='30px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('骑行 · 网球 · 徒步 · 游泳',78,1740);x.textAlign='right';x.fillStyle='#35b7f4';x.font='800 34px -apple-system, BlinkMacSystemFont, sans-serif';x.fillText('Candy Movement Log',1002,1740);return c.toDataURL('image/png')}
  function fitText(ctx,text,x,y,max,center){const sizeMatch=ctx.font.match(/(\d+)px/);let s=sizeMatch?Number(sizeMatch[1]):31;while(ctx.measureText(text).width>max&&s>18){s--;ctx.font=ctx.font.replace(/\d+px/,s+'px')}ctx.textAlign=center?'center':'left';ctx.fillText(text,x,y);ctx.textAlign='left'}
  function wrapLeft(ctx,text,x,y,max,lineH,maxLines){const chars=[...text];let lines=[''];for(const ch of chars){const last=lines.length-1;if(ctx.measureText(lines[last]+ch).width>max&&lines.length<maxLines)lines.push(ch);else lines[last]+=ch}lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineH))}
  async function shareRecord(r){if(!r.dataUrl)r.dataUrl=await makeCanvas(r);try{const blob=await(await fetch(r.dataUrl)).blob();const file=new File([blob],`Candy运动打卡-${r.id}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Candy今天运动了',text:`${r.sport} ${r.time}分钟`,files:[file]})}else showToast('当前浏览器不支持直接分享，请长按图片保存')}catch(e){if(e.name!=='AbortError')showToast('分享未完成，请长按图片保存')}}
  $('#modalClose').addEventListener('click',closeShareModal);$('#shareModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeShareModal()});$('#modalShare').addEventListener('click',()=>{if(activeShareRecord)shareRecord(activeShareRecord)});
  $('#generate').addEventListener('click',async e=>{if(!validate())return;const btn=e.currentTarget,now=new Date(),r={id:Date.now(),sport:state.sport,icon:state.icon,time:state.time,city:city.value.trim(),place:place.value.trim(),feeling:feeling.value.trim(),photoData:state.photoData,date:new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(now),shortDate:niceDate(now)};btn.disabled=true;btn.textContent='正在保存…';try{await saveStoredRecord(r);state.records.unshift(r);state.records.sort((a,b)=>b.id-a.id);render();resetForm();showToast('打卡记录已保存 ✨');setTimeout(()=>{const first=$('.record');if(first)first.scrollIntoView({behavior:'smooth',block:'center'})},250)}catch(err){console.error('保存运动记录失败：',err);showInlineError(friendlyStorageError(err,'保存记录'))}finally{btn.disabled=false;btn.textContent='生成今日打卡记录'}});
  function resetForm(){state.sport='';state.icon='';state.time='';state.photoData='';city.value='';place.value='';city.placeholder=locationPresets['骑行'].city;place.placeholder=locationPresets['骑行'].place;feeling.value='';photoInput.value='';photoPreview.removeAttribute('src');uploadBox.classList.remove('has-photo');$('#count').textContent='0';$$('.sport,.time').forEach(x=>x.classList.remove('active'))}
  clearAll.addEventListener('click',async()=>{if(!confirm('确定清空今天的全部记录吗？'))return;clearAll.disabled=true;try{await clearStoredRecords();state.records=[];closeShareModal();render();showToast('今日记录已清空')}catch(err){console.error('清空运动记录失败：',err);clearAll.disabled=false;showToast(friendlyStorageError(err,'清空记录'))}});$('#generate').disabled=true;render();loadSavedRecords();
})();
